<div class="login-container">
  <div class="login-box">
    <h2>Welcome Back</h2>
    <p class="login-subtitle">Access the Enterprise Vendor Management System</p>
    
    <div *ngIf="error" class="error-message">
      <span class="material-icons-round">error_outline</span>
      <span>{{ error }}</span>
    </div>

    <form (ngSubmit)="onLogin(emailInput.value, passwordInput.value)">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" #emailInput placeholder="name@company.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" #passwordInput placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    
    <p class="register-link">
      Don't have an account? <a routerLink="/register">Create one now</a>
    </p>
  </div>
</div>
