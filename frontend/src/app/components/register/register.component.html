<div class="register-container">
  <div class="register-box">
    <h2>Create Account</h2>
    <p class="register-subtitle">Join the Enterprise Vendor Management System</p>
    
    <div *ngIf="error" class="error-message">
      <span class="material-icons-round">error_outline</span>
      <span>{{ error }}</span>
    </div>

    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" [(ngModel)]="fullName" name="fullName" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="name@company.com" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>
      <div class="form-group">
        <label for="role">Desired Role</label>
        <select id="role" [(ngModel)]="role" name="role" required>
          <option value="VENDOR">Vendor (Submit Invoices)</option>
          <option value="MANAGER">Manager (Review & Manage)</option>
          <option value="ADMIN">Admin (Full Control)</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <p class="login-link">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>
